name: notebooks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run churnvalue pipeline
      - run: uv run churnvalue notebooks
      - run: uv run pytest -m slow
      - uses: actions/upload-artifact@v4
        with:
          name: notebooks-html
          path: ml/reports/notebooks/
      - name: Committed notebooks are up to date
        run: git diff --stat --exit-code -- notebooks || echo "::warning::re-executed notebooks differ from the committed ones"
