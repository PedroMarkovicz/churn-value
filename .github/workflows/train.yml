name: train

# Manual: rebuild everything from the public dataset and publish the web artifacts as a release.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Optuna trials per model
        type: number
        default: 40

permissions:
  contents: write # create the release

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # gh uses GH_TOKEN; keep the write token out of .git/config
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run churnvalue pipeline --trials "$TRIALS"
        env:
          TRIALS: ${{ inputs.trials }}
      - run: uv run pytest -m slow
      - name: Publish the artifacts as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="artifacts-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          tar -czf "$tag.tar.gz" -C artifacts .
          gh release create "$tag" "$tag.tar.gz" artifacts/manifest.json \
            --title "$tag" --notes-file ../docs/model-card.md
