name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # read the code and download the pinned artifacts release

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Contract code matches the schemas
        run: npm run gen:contract && git diff --exit-code -- src/contract
      - run: npm run palette
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Cache the pinned artifacts
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: artifacts-${{ hashFiles('web/artifacts.lock.json') }}
      - name: Fetch the pinned artifacts (checksums verified)
        run: npm run artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-reports
          path: |
            web/playwright-report
            web/.lighthouseci
          include-hidden-files: true # .lighthouseci is a dot folder
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache the pinned artifacts
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: artifacts-${{ hashFiles('web/artifacts.lock.json') }}
      - name: Fetch the pinned artifacts (checksums verified)
        run: npm run artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - run: npm run test:visual
      - name: Keep the diffs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Cache the pinned artifacts
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: artifacts-${{ hashFiles('web/artifacts.lock.json') }}
      - name: Fetch the pinned artifacts (checksums verified)
        run: npm run artifacts
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
        working-directory: web
      - name: Every cached-for-a-year file has a content hash
        run: npm run check:assets
        working-directory: web
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Notebook pages from the committed notebooks (not executed)
        run: uv sync --locked && uv run churnvalue notebooks-site --out ../web/dist/notebooks
        working-directory: ml
      - name: Serve the bundle as Cloudflare will, and check it
        working-directory: web
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          npm run smoke -- http://localhost:8787 --wait 60
      - name: Keep the server log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: web/wrangler.log
          retention-days: 7
      - name: Keep the bundle for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [ml, web, visual, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: The bundle the site job built and checked
        uses: actions/download-artifact@v4
        with:
          name: site
          path: web/dist
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: Check the live site
        run: npm run smoke -- --wait 120
