name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # read the code and download the pinned artifacts release

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Contract code matches the schemas
        run: npm run gen:contract && git diff --exit-code -- src/contract
      - run: npm run palette
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Cache the pinned artifacts
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: artifacts-${{ hashFiles('web/artifacts.lock.json') }}
      - name: Fetch the pinned artifacts (checksums verified)
        run: npm run artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-reports
          path: |
            web/playwright-report
            web/.lighthouseci
          include-hidden-files: true # .lighthouseci is a dot folder
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache the pinned artifacts
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: artifacts-${{ hashFiles('web/artifacts.lock.json') }}
      - name: Fetch the pinned artifacts (checksums verified)
        run: npm run artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - run: npm run test:visual
      - name: Keep the diffs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Cache the pinned artifacts
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: artifacts-${{ hashFiles('web/artifacts.lock.json') }}
      - name: Fetch the pinned artifacts (checksums verified)
        run: npm run artifacts
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
        working-directory: web
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Notebook pages from the committed notebooks (not executed)
        run: uv sync --locked && uv run churnvalue notebooks-site --out ../web/dist/notebooks
        working-directory: ml
      - name: Serve the bundle as Cloudflare will, and check it
        working-directory: web
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          npm run smoke -- http://localhost:8787 --wait 60 --index dist/index.html
      - name: Keep the server log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: web/wrangler.log
          retention-days: 7
      - name: Keep the bundle for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          if-no-files-found: error
          retention-days: 1 # every pull request push uploads it; deploy reads it at once

  deploy:
    needs: [ml, web, visual, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # An older run that finishes last, or is re-run later, must not put an older commit live.
      - name: Deploy only the tip of main
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tip=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main")
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is now at $tip; this run publishes nothing"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.tip.outputs.current == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.tip.outputs.current == 'true'
      - name: The bundle the site job built and checked
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: web/dist
      - name: Deploy to Cloudflare Workers
        if: steps.tip.outputs.current == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      # --index: wait until the live site serves this very build, not the one before it.
      - name: Check the live site
        if: steps.tip.outputs.current == 'true'
        run: npm run smoke -- --wait 120 --index dist/index.html

  preview:
    needs: [site]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer push replaces an older run, so the alias never ends on the older commit.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # the comment with the preview's address
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: The bundle the site job built and checked
        uses: actions/download-artifact@v4
        with:
          name: site
          path: web/dist
      - name: Upload a preview version (the live site does not change)
        shell: bash # with pipefail: this step fails when wrangler fails, not the next one
        run: npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          NO_COLOR: "1"
      - name: The preview's address
        id: address
        run: |
          url=$(grep -o 'Version Preview Alias URL: https://[^ ]*' upload.log | sed 's/.*URL: //' || true)
          if [ -z "$url" ]; then
            # no alias: the version's own address, which the same command prints
            url=$(grep -o 'Version Preview URL: https://[^ ]*' upload.log | sed 's/.*URL: //' || true)
          fi
          if [ -z "$url" ]; then
            echo "wrangler printed no preview address"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check the preview
        run: npm run smoke -- "${{ steps.address.outputs.url }}" --wait 120 --index dist/index.html
      - name: Say the address on the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.address.outputs.url }}
        with:
          script: |
            const marker = "<!-- preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\nPreview of ${sha}: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const mine = comments.find((comment) => comment.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
